name: Deploy Supabase

# Разворачивает базу и функцию game в проекте Supabase и настраивает вход.
#
# Запуск вручную: Actions → Deploy Supabase → Run workflow → выбрать ветку.
# Автоматически — при изменениях в supabase/ на основной ветке репозитория.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  личный токен Supabase (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   пароль базы проекта
#   ADMIN_EMAILS           необязательно: администраторы через запятую
#   SMTP_PASS              необязательно: ключ почтового сервиса (Resend);
#                          без него Supabase шлёт письма только своей команде

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    # Вручную — с любой ветки; при пуше — только с основной.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: fzchwkwyicnjbtjkqack
      # Публичный ключ — не секрет: он и так уезжает в браузер каждому игроку.
      PUBLISHABLE_KEY: sb_publishable_Q7RQ9We4D2h8qEiW1-ISjg_8P_Fq3_p
      SITE_URL: https://marketgame.click
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.resend.com' }}
      SMTP_USER: ${{ vars.SMTP_USER || 'resend' }}
      SMTP_SENDER: ${{ vars.SMTP_SENDER || 'noreply@marketgame.click' }}
    steps:
      - uses: actions/checkout@v5

      - name: Secrets are in place
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add repository secret SUPABASE_ACCESS_TOKEN"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Add repository secret SUPABASE_DB_PASSWORD"; missing=1; }
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Tables before migrations (for the log)
        run: supabase inspect db table-stats --linked || true

      - name: Database migrations
        run: supabase db push --linked

      - name: Edge Function
        run: supabase functions deploy game --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Function secrets
        if: env.ADMIN_EMAILS != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" ADMIN_EMAILS="$ADMIN_EMAILS"

      # Самостоятельной регистрации нет, письмо несёт 6 цифр вместо ссылки.
      - name: Sign-in settings
        run: |
          body=$(jq -n --rawfile tpl supabase/templates/magic_link.html --arg site "$SITE_URL" '{
            disable_signup: true,
            external_email_enabled: true,
            site_url: $site,
            uri_allow_list: "https://marketgame.click,https://www.marketgame.click,http://localhost:8080,http://127.0.0.1:8080",
            mailer_otp_length: 6,
            mailer_otp_exp: 3600,
            mailer_subjects_magic_link: "Your Market Game sign-in code",
            mailer_templates_magic_link_content: $tpl
          }')
          code=$(curl -s -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            cat resp.json
            echo "::warning::Sign-in settings were not applied — set them in the dashboard (see README)"
          fi

      # Сначала пробное письмо через Resend: если домен ещё не подтверждён
      # или ключ неверный, Resend откажет — и почту Supabase мы не трогаем,
      # вход по коду продолжает работать как раньше. Письмо придёт первому
      # администратору. Только при ручном запуске: письмо на каждый пуш ни к чему.
      - name: Email service check (test email via Resend)
        if: env.SMTP_PASS != '' && github.event_name == 'workflow_dispatch' && env.SMTP_HOST == 'smtp.resend.com'
        run: |
          to="${ADMIN_EMAILS:-ph001player1@gmail.com}"; to="${to%%,*}"; to="$(echo "$to" | xargs)"
          body=$(jq -n --arg from "Market Game <$SMTP_SENDER>" --arg to "$to" '{
            from: $from, to: [$to],
            subject: "Market Game: sign-in emails are connected",
            text: "This test message confirms that Market Game can send sign-in codes from marketgame.click through Resend. No action needed."
          }')
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $SMTP_PASS" -H 'Content-Type: application/json' -d "$body")
          echo "HTTP $code"; cat resp.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Resend refused the test email. Check that the domain is Verified in Resend and that SMTP_PASS is a Sending access key for marketgame.click. Supabase email settings were not changed."
            exit 1
          fi

      # Почту Supabase переключаем только при ручном запуске, после
      # удачного пробного письма. Настройка сохраняется в Supabase, повторять
      # её на каждом пуше не нужно.
      - name: Email sending (custom SMTP)
        if: env.SMTP_PASS != '' && github.event_name == 'workflow_dispatch'
        run: |
          body=$(jq -n --arg host "$SMTP_HOST" --arg user "$SMTP_USER" --arg pass "$SMTP_PASS" --arg from "$SMTP_SENDER" '{
            smtp_host: $host, smtp_port: "465", smtp_user: $user, smtp_pass: $pass,
            smtp_admin_email: $from, smtp_sender_name: "Market Game",
            rate_limit_email_sent: 200
          }')
          code=$(curl -s -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          echo "HTTP $code"
          [ "$code" = "200" ] || { cat resp.json; exit 1; }

      - name: Smoke test
        run: |
          sleep 10
          out=$(curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/game" \
            -H "apikey: $PUBLISHABLE_KEY" -H 'content-type: application/json' -d '{"action":"ping"}')
          echo "$out"
          echo "$out" | grep -q '"version":"5.0"'
          out=$(curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/game" \
            -H "apikey: $PUBLISHABLE_KEY" -H 'content-type: application/json' -d '{"action":"rating"}')
          echo "$out" | head -c 300; echo
          echo "$out" | grep -q '"ok":true'
          # Вход: почту администратора функция пускает и заводит в Supabase
          # Auth, случайную — нет. Письмо здесь не отправляется.
          admin=$(echo "${ADMIN_EMAILS:-ph001player1@gmail.com}" | cut -d, -f1 | tr -d ' ')
          out=$(curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/game" \
            -H "apikey: $PUBLISHABLE_KEY" -H 'content-type: application/json' \
            -d "{\"action\":\"preflightLogin\",\"email\":\"$admin\"}")
          echo "admin sign-in: $out"
          echo "$out" | grep -q '"ok":true'
          out=$(curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/game" \
            -H "apikey: $PUBLISHABLE_KEY" -H 'content-type: application/json' \
            -d '{"action":"preflightLogin","email":"nobody@example.com"}')
          echo "stranger sign-in: $out"
          echo "$out" | grep -q '"not_registered"'
          # Логотип спонсора браузер берёт обычным <img> — без ключей и
          # заголовков. Несуществующий логотип: 404 от функции, а не 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://$PROJECT_REF.supabase.co/functions/v1/game?logo=00000000-0000-0000-0000-000000000000")
          echo "logo without keys: HTTP $code"
          [ "$code" = "404" ]
