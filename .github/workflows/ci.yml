name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Эталон экономики (400 сценариев), проверка перехода на доллары
      # и полнота сброса партии.
      - run: npm test
      # Отчёт о выживании команд в первый месяц — для сведения, не падает.
      - run: node tests/teams_check.mjs
